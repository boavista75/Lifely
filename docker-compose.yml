services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: lifely
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifely -d lifely"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://lifely:${POSTGRES_PASSWORD}@db:5432/lifely
      APP_ORIGIN: ${APP_ORIGIN:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_USERNAME: ${SEED_USERNAME:-}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      MEDIA_DIR: /data/media
      TRUST_PROXY: "true"
      PORT: "3001"
    volumes:
      - media:/data/media
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy:
  caddy_config:
