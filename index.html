<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#DFF8EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lifely" />
    <meta name="application-name" content="Lifely" />
    <meta
      name="description"
      content="Lifely — kalendar, todo, beleške, znanje i finansije."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lifely</title>
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--mint, #dff8eb);
        color: var(--navy, #011638);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        user-select: none;
      }
      html[data-theme="dark"] .boot-screen {
        background: var(--navy, #011638);
        color: var(--mint, #dff8eb);
      }
      .boot-screen__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.15rem;
      }
      .boot-screen__brand {
        margin: 0;
        font-family: Fraunces, "Iowan Old Style", Palatino, serif;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .boot-screen__spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2.5px solid color-mix(in srgb, currentColor 16%, transparent);
        border-top-color: var(--forest, #214e34);
        animation: boot-spin 0.72s linear infinite;
      }
      html[data-theme="dark"] .boot-screen__spinner {
        border-top-color: var(--mint, #dff8eb);
      }
      .boot-screen__label {
        margin: 0;
        font-size: 15px;
        letter-spacing: -0.011em;
        color: var(--slate, #364156);
      }
      html[data-theme="dark"] .boot-screen__label {
        color: var(--silver, #cdcdcd);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen__spinner {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var palettes = {
            grove: ["#011638", "#364156", "#cdcdcd", "#dff8eb", "#214e34"],
            harbor: ["#0d1b2a", "#1b263b", "#778da9", "#e0e1dd", "#415a77"],
            moss: ["#2f3e46", "#354f52", "#84a98c", "#cad2c5", "#52796f"],
            dusk: ["#22223b", "#4a4e69", "#c9ada7", "#f2e9e4", "#9a8c98"],
            clay: ["#1c1412", "#3d2b2a", "#d7ccc8", "#f5ebe0", "#c0897e"],
          };
          var keys = ["--navy", "--slate", "--silver", "--mint", "--forest"];
          var storedTheme = localStorage.getItem("lifely-theme");
          var theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var storedPalette = localStorage.getItem("lifely-palette");
          var paletteId = palettes[storedPalette] ? storedPalette : "grove";
          var colors = palettes[paletteId];
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.palette = paletteId;
          root.style.colorScheme = theme;
          for (var i = 0; i < keys.length; i++) {
            root.style.setProperty(keys[i], colors[i]);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? colors[0] : colors[3]);
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-screen__inner">
          <p class="boot-screen__brand">Lifely</p>
          <span class="boot-screen__spinner"></span>
          <p class="boot-screen__label">Učitavanje…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
