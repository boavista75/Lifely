<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#DFF8EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lifely" />
    <meta name="application-name" content="Lifely" />
    <meta
      name="description"
      content="Lifely — kalendar, todo, beleške, znanje i finansije."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lifely</title>
    <script>
      (function () {
        try {
          var palettes = {
            grove: ["#011638", "#364156", "#cdcdcd", "#dff8eb", "#214e34"],
            harbor: ["#0d1b2a", "#1b263b", "#778da9", "#e0e1dd", "#415a77"],
            moss: ["#2f3e46", "#354f52", "#84a98c", "#cad2c5", "#52796f"],
            dusk: ["#22223b", "#4a4e69", "#c9ada7", "#f2e9e4", "#9a8c98"],
            clay: ["#1c1412", "#3d2b2a", "#d7ccc8", "#f5ebe0", "#c0897e"],
          };
          var keys = ["--navy", "--slate", "--silver", "--mint", "--forest"];
          var storedTheme = localStorage.getItem("lifely-theme");
          var theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var storedPalette = localStorage.getItem("lifely-palette");
          var paletteId = palettes[storedPalette] ? storedPalette : "grove";
          var colors = palettes[paletteId];
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.palette = paletteId;
          root.style.colorScheme = theme;
          for (var i = 0; i < keys.length; i++) {
            root.style.setProperty(keys[i], colors[i]);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? colors[0] : colors[3]);
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
